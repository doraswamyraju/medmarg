# ==============================================================================
# MEDMARG HOSTINGER VPS NGINX CONFIGURATION
# Location on VPS: /etc/nginx/sites-available/medmarg.conf
#
# Dedicated internal port: 5080 (Safe from ports 5000-5009 used by other apps)
# ==============================================================================

# API Subdomain: api.medmarg.com
server {
    listen 80;
    server_name api.medmarg.com;

    client_max_body_size 50M; # Support large scan/report uploads to Google Drive

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Web App: www.medmarg.com / medmarg.com
server {
    listen 80;
    server_name medmarg.com www.medmarg.com;

    root /var/www/medmarg/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
